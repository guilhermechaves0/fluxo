# Regra de dependência do serviço Go, conferida pelo arch-go no CI.
#
# O pacote importador/dominio só interpreta texto (OFX, CSV e as linhas da fatura em PDF). Se ele
# importar net/http, encoding/json, database/sql ou a biblioteca de PDF, a verificação falha.
version: 1
threshold:
  compliance: 100
  coverage: 0
dependenciesRules:
  - package: "**.importador.dominio"
    shouldNotDependsOn:
      standard:
        - "net/http"
        - "encoding/json"
        - "database/sql"
      external:
        - "github.com/ledongthuc/pdf" # a leitura de PDF fica em importador/pdftexto (ADR 0002)
