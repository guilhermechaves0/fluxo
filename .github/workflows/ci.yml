# Integração contínua do Fluxo, com um job por componente:
#   kotlin  ktlintCheck, detekt, testes (com o de arquitetura da api) e build da api, do app desktop e do APK
#           (DIM0524 e DIM0547)
#   go      gofmt, go vet, arch-go, testes e build do importador (DIM0547)
#   proto   buf lint, buf build e conferência dos stubs de Go gerados do contrato (DIM0547)
#   imagens constrói as imagens da api e do importador; na main, publica no ghcr.io (DIM0547)
#   migrar  na main, roda `migrar` da imagem publicada contra o banco gerenciado (DIM0547)
#
# `mise run ci` roda as mesmas verificações localmente.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kotlin:
    name: Kotlin (app, shared, api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint e detekt
        run: ./gradlew ktlintCheck detekt

      # Os testes de interface rodam no alvo desktop e o Skia precisa destas bibliotecas no Linux.
      - name: Bibliotecas gráficas para os testes de interface
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libfontconfig1

      # O :api:test inclui o ArquiteturaTest, que falha se a camada de aplicação importar framework, e os
      # testes de integração, que sobem um PostgreSQL com o Testcontainers. O runner já tem Docker, e nada
      # muda em relação à máquina local.
      - name: Testes (domínio, api com arquitetura e integração, interface)
        run: ./gradlew :shared:jvmTest :api:test :app:jvmTest

      - name: Build (api, app desktop e APK de debug)
        run: ./gradlew :api:installDist :app:jvmJar :app-android:assembleDebug

  go:
    name: Go (services)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum

      - name: gofmt
        run: |
          fora=$(gofmt -l .)
          if [ -n "$fora" ]; then
            echo "::error::Arquivos fora do padrão gofmt:"; echo "$fora"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Arquitetura (arch-go)
        run: |
          go install github.com/arch-go/arch-go@v1.7.0
          "$(go env GOPATH)/bin/arch-go"

      - name: Testes
        run: go test -race ./...

      - name: Build
        run: go build ./...

  proto:
    name: Contrato (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.71.0
          github_token: ${{ github.token }}

      - name: buf lint
        run: buf lint

      - name: buf build
        run: buf build

      # Os stubs de Go ficam versionados em services/gen. Se o .proto mudou e eles não, o status acusa,
      # inclusive arquivo novo que ainda não está no git.
      - name: Stubs de Go em dia
        run: |
          buf generate
          test -z "$(git status --porcelain -- services/gen)"

  # Em pull request só constrói, para provar que os Dockerfiles funcionam antes do merge. Na main publica
  # com as etiquetas do commit (para voltar a uma versão exata) e latest. Não faz parte do agregador `ci`.
  imagens:
    name: Imagens (${{ matrix.nome }})
    needs: [kotlin, go, proto] # só publica se os testes passarem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # o GITHUB_TOKEN publica no ghcr.io do repositório
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: api
            contexto: .
            dockerfile: api/Dockerfile
          - nome: importador
            contexto: services
            dockerfile: services/Dockerfile
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem em minúsculas
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.nome }}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:latest
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}

  # Aplica as migrações no banco gerenciado com a imagem que acabou de ser publicada. Sem os segredos do
  # repositório, termina verde com um aviso.
  migrar:
    name: Migrar o banco
    needs: [imagens]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Conferir os segredos
        id: segredos
        run: |
          if [ -z "$DB_URL" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::warning::Segredos DB_URL, DB_USER e DB_PASSWORD ausentes: migração pulada."
            echo "presentes=false" >> "$GITHUB_OUTPUT"
          else
            echo "presentes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Login no ghcr.io
        if: steps.segredos.outputs.presentes == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Rodar migrar
        if: steps.segredos.outputs.presentes == 'true'
        run: |
          imagem="ghcr.io/${GITHUB_REPOSITORY,,}/api:${{ github.sha }}"
          docker run --rm -e DB_URL -e DB_USER -e DB_PASSWORD "$imagem" migrar

  # Job exigido pela proteção da main; falha se algum job anterior falhar.
  ci:
    name: ci
    needs: [kotlin, go, proto]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultados
        run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            if [ "$r" != "success" ]; then
              echo "::error::Algum job não passou ($r)."; exit 1
            fi
          done
          echo "Tudo verde."
